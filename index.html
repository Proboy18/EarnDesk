<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnDesk - Get Paid To Complete Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        #logout-btn {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to EarnDesk!</h1>
        <div id="auth-section">
            <p>Sign in to start earning points.</p>
            <input type="email" id="email" placeholder="Enter email">
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="register()">Sign Up</button>
            <button onclick="login()" style="background-color: #28a745;">Login</button>
        </div>

        <div id="dashboard-section" style="display: none;">
            <p>Welcome, <span id="user-email"></span>!</p>
            <p>Current Balance: <strong id="balance">0 Points</strong></p>
            <button onclick="addBonusPoints()" style="background-color: #ffc107; color: black;">Earn 10 Bonus Points!</button>
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj2UGAr1gGgxfF89_vxgSE2DGFHuzdFxA",
            authDomain: "earndesk-cb89a.firebaseapp.com",
            projectId: "earndesk-cb89a",
            storageBucket: "earndesk-cb89a.firebasestorage.app",
            messagingSenderId: "1055418624977",
            appId: "1:1055418624977:web:edda1cd8076ec113d74ef0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.register = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                // Create a user document in Firestore with 0 points
                await setDoc(doc(db, "users", user.uid), {
                    email: user.email,
                    points: 0
                });
            } catch (error) {
                alert(error.message);
            }
        }

        window.login = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => { alert(error.message); });
        }

        window.logout = function() {
            signOut(auth);
        }

        // Function to test earning points
        window.addBonusPoints = async function() {
            const user = auth.currentUser;
            if (user) {
                const userRef = doc(db, "users", user.uid);
                await updateDoc(userRef, {
                    points: increment(10)
                });
                fetchUserData(user); // Refresh points on screen
            }
        }

        async function fetchUserData(user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('balance').innerText = data.points + " Points";
            } else {
                // If the user was created before we added the database, give them a starting document
                await setDoc(docRef, {
                    email: user.email,
                    points: 0
                });
                document.getElementById('balance').innerText = "0 Points";
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
                fetchUserData(user); // Load points from Firestore
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        });
    </script>
</body>
</html>
