<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnDesk - Get Paid To Complete Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        #logout-btn {
            background-color: #dc3545;
        }
        .streak-box {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>EarnDesk Dashboard</h1>
        <div id="auth-section">
            <p>Sign in to start earning cash.</p>
            <input type="email" id="email" placeholder="Enter email">
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="register()">Sign Up</button>
            <button onclick="login()" style="background-color: #28a745;">Login</button>
        </div>

        <div id="dashboard-section" style="display: none;">
            <p>Welcome, <span id="user-email"></span>!</p>
            <p>Current Balance: <strong id="balance">$0.00</strong></p>
            
            <div class="streak-box">
                <p>🔥 Login Streak: <strong id="streak-count">0</strong> Days</p>
                <p id="streak-status">Checking status...</p>
                <button id="claim-btn" onclick="claimDailyReward()" style="background-color: #ffc107; color: black; display: none;">Claim Daily Reward!</button>
            </div>

            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj2UGAr1gGgxfF89_vxgSE2DGFHuzdFxA",
            authDomain: "earndesk-cb89a.firebaseapp.com",
            projectId: "earndesk-cb89a",
            storageBucket: "earndesk-cb89a.firebasestorage.app",
            messagingSenderId: "1055418624977",
            appId: "1:1055418624977:web:edda1cd8076ec113d74ef0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.register = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await setDoc(doc(db, "users", user.uid), {
                    email: user.email,
                    balance: 0.00,
                    streak: 0,
                    lastLoginDate: ""
                });
            } catch (error) {
                alert(error.message);
            }
        }

        window.login = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => { alert(error.message); });
        }

        window.logout = function() {
            signOut(auth);
        }

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function getYesterdayDate() {
            const date = new Date();
            date.setDate(date.getDate() - 1);
            return date.toISOString().split('T')[0];
        }

        async function fetchUserData(user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                const currentBalance = data.balance || 0;
                document.getElementById('balance').innerText = "$" + currentBalance.toFixed(2);
                document.getElementById('streak-count').innerText = data.streak || 0;

                const today = getTodayDate();
                const yesterday = getYesterdayDate();
                const lastLogin = data.lastLoginDate || "";

                const claimBtn = document.getElementById('claim-btn');
                const streakStatus = document.getElementById('streak-status');

                if (lastLogin === today) {
                    claimBtn.style.display = 'none';
                    streakStatus.innerText = "Reward claimed for today! Come back tomorrow.";
                } else {
                    claimBtn.style.display = 'block';
                    if (lastLogin === yesterday) {
                        streakStatus.innerText = "Keep your streak going to earn more cash!";
                    } else if (lastLogin !== "") {
                        streakStatus.innerText = "Streak reset because you missed a day!";
                    } else {
                        streakStatus.innerText = "Claim your first daily reward!";
                    }
                }
            } else {
                await setDoc(docRef, {
                    email: user.email,
                    balance: 0.00,
                    streak: 0,
                    lastLoginDate: ""
                });
                fetchUserData(user);
            }
        }

        window.claimDailyReward = async function() {
            const user = auth.currentUser;
            if (!user) return;

            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;

            const data = docSnap.data();
            const today = getTodayDate();
            const yesterday = getYesterdayDate();
            const lastLogin = data.lastLoginDate || "";

            let newStreak = 1;
            if (lastLogin === yesterday) {
                newStreak = (data.streak || 0) + 1;
                if (newStreak > 7) {
                    newStreak = 1; 
                }
            }

            // Balanced reward calculation: Day 1 = $0.01, Day 7 = $0.07
            const cashEarned = newStreak * 0.01;

            await updateDoc(docRef, {
                balance: increment(cashEarned),
                streak: newStreak,
                lastLoginDate: today
            });

            alert(`Successfully claimed Day ${newStreak} reward: $${cashEarned.toFixed(2)}!`);
            fetchUserData(user);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
                fetchUserData(user);
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        });
    </script>
</body>
</html>
