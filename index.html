<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnDesk - Get Paid To Complete Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px; /* Made bigger and wider */
            box-sizing: border-box;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        #logout-btn {
            background-color: #dc3545;
            margin-top: 30px;
        }
        .nav-btn {
            display: block;
            width: 100%;
            margin: 20px 0;
            background-color: #007bff; 
            color: white;
            padding: 14px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .streak-box {
            display: none; 
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        .streak-grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 0;
            overflow-x: auto;
        }
        .streak-day {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 12px 6px;
            flex: 1;
            font-size: 13px;
            text-align: center;
        }
        .streak-day.active {
            border-color: #28a745;
            background-color: #e6f4ea;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dashboard</h1>
        <div id="auth-section">
            <p>Sign in to start earning cash.</p>
            <input type="email" id="email" placeholder="Enter email">
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="register()">Sign Up</button>
            <button onclick="login()" style="background-color: #28a745;">Login</button>
        </div>

        <div id="dashboard-section" style="display: none;">
            <p style="font-size: 18px;">Welcome, <span id="user-email"></span>!</p>
            <p style="font-size: 20px;">Current Balance: <strong id="balance" style="color: #28a745;">$0.00</strong></p>
            
            <button class="nav-btn" onclick="toggleRewardBox()">🎁 Daily reward</button>

            <div class="streak-box" id="reward-section">
                <p style="font-size: 16px;">🔥 Login Streak: <strong id="streak-count">0</strong> Days</p>
                
                <div class="streak-grid" id="streak-grid-container">
                    <div class="streak-day" id="day-1">1d<br>$0.01</div>
                    <div class="streak-day" id="day-2">2d<br>$0.02</div>
                    <div class="streak-day" id="day-3">3d<br>$0.03</div>
                    <div class="streak-day" id="day-4">4d<br>$0.04</div>
                    <div class="streak-day" id="day-5">5d<br>$0.05</div>
                    <div class="streak-day" id="day-6">6d<br>$0.06</div>
                    <div class="streak-day" id="day-7">7d<br>$0.07</div>
                </div>

                <p id="streak-status" style="margin: 15px 0; font-weight: 500;">Checking status...</p>
                <button id="claim-btn" onclick="claimDailyReward()" style="background-color: #ffc107; color: black; display: none; font-weight: bold;">Claim Daily Reward!</button>
            </div>

            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj2UGAr1gGgxfF89_vxgSE2DGFHuzdFxA",
            authDomain: "earndesk-cb89a.firebaseapp.com",
            projectId: "earndesk-cb89a",
            storageBucket: "earndesk-cb89a.firebasestorage.app",
            messagingSenderId: "1055418624977",
            appId: "1:1055418624977:web:edda1cd8076ec113d74ef0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.register = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await setDoc(doc(db, "users", user.uid), {
                    email: user.email,
                    balance: 0.00,
                    streak: 0,
                    lastLoginDate: ""
                });
            } catch (error) {
                alert(error.message);
            }
        }

        window.login = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => { alert(error.message); });
        }

        window.logout = function() {
            signOut(auth);
        }

        window.toggleRewardBox = function() {
            const rewardBox = document.getElementById('reward-section');
            if (rewardBox.style.display === 'block') {
                rewardBox.style.display = 'none';
            } else {
                rewardBox.style.display = 'block';
            }
        }

        function getTodayDate() {
            return new Date().toISOString().split('T')[0];
        }

        function getYesterdayDate() {
            const date = new Date();
            date.setDate(date.getDate() - 1);
            return date.toISOString().split('T')[0];
        }

        async function fetchUserData(user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                const currentBalance = data.balance || 0;
                const currentStreak = data.streak || 0;

                document.getElementById('balance').innerText = "$" + currentBalance.toFixed(2);
                document.getElementById('streak-count').innerText = currentStreak;

                for (let i = 1; i <= 7; i++) {
                    const dayBox = document.getElementById(`day-${i}`);
                    if (dayBox) {
                        if (i === currentStreak) {
                            dayBox.classList.add('active');
                        } else {
                            dayBox.classList.remove('active');
                        }
                    }
                }

                const today = getTodayDate();
                const yesterday = getYesterdayDate();
                const lastLogin = data.lastLoginDate || "";

                const claimBtn = document.getElementById('claim-btn');
                const streakStatus = document.getElementById('streak-status');

                if (lastLogin === today) {
                    claimBtn.style.display = 'none';
                    streakStatus.innerText = "Reward claimed for today! Come back tomorrow.";
                } else {
                    claimBtn.style.display = 'block';
                    if (lastLogin === yesterday) {
                        streakStatus.innerText = "Keep your streak going to earn more cash!";
                    } else if (lastLogin !== "") {
                        streakStatus.innerText = "Streak reset because you missed a day!";
                    } else {
                        streakStatus.innerText = "Claim your first daily reward!";
                    }
                }
            } else {
                await setDoc(docRef, {
                    email: user.email,
                    balance: 0.00,
                    streak: 0,
                    lastLoginDate: ""
                });
                fetchUserData(user);
            }
        }

        window.claimDailyReward = async function() {
            const user = auth.currentUser;
            if (!user) return;

            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) return;

            const data = docSnap.data();
            const today = getTodayDate();
            const yesterday = getYesterdayDate();
            const lastLogin = data.lastLoginDate || "";

            let newStreak = 1;
            if (lastLogin === yesterday) {
                newStreak = (data.streak || 0) + 1;
                if (newStreak > 7) {
                    newStreak = 1; 
                }
            }

            const cashEarned = newStreak * 0.01;

            await updateDoc(docRef, {
                balance: increment(cashEarned),
                streak: newStreak,
                lastLoginDate: today
            });

            alert(`Successfully claimed Day ${newStreak} reward: $${cashEarned.toFixed(2)}!`);
            fetchUserData(user);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
                fetchUserData(user);
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        });
    </script>
</body>
</html>
